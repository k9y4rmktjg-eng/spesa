name: Aggiorna offerte

on:
  schedule:
    # lunedì e giovedì alle 6:10 (ora italiana invernale = 5:10 UTC)
    - cron: "10 5 * * 1,4"
  workflow_dispatch: {}   # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: aggiorna-offerte
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa strumenti
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scarica le offerte
        run: python scraper/scrape.py

      - name: Salva le offerte nel repository
        if: always()
        run: |
          git config user.name "aggiorna-offerte"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Offerte aggiornate $(date +'%d/%m/%Y')"
            git push
          fi
